gunPart(new THREE.BoxGeometry(.22,.19,.53),gunMetal,[.32,-.27,-.58]);gunPart(new THREE.BoxGeometry(.17,.13,.3),polymer,[.32,-.28,-.25]);gunPart(new THREE.CylinderGeometry(.045,.055,.52,12),gunMetal,[.32,-.23,-1.02],[Math.PI/2,0,0]);gunPart(new THREE.CylinderGeometry(.075,.075,.08,12),gunGlow,[.32,-.23,-1.29],[Math.PI/2,0,0]);gunPart(new THREE.BoxGeometry(.10,.24,.15),polymer,[.32,-.47,-.48],[.2,0,0]);gunPart(new THREE.BoxGeometry(.12,.23,.09),polymer,[.32,-.18,-.34]);gunPart(new THREE.BoxGeometry(.075,.045,.20),gunGlow,[.32,-.15,-.67]);

const player={health:100,x:0,z:10,yaw:0,pitch:0,speed:6.4,ammo:12,reserve:60,runTime:0,slideTime:0,slideCooldown:0};const ai={health:100,x:0,z:-10,fireTimer:1.1,strafe:1,strafeTimer:0};const keys={};let playing=false,ended=false,lastShot=0,hitFlash=0,reloading=false,reloadStart=0,inspectStart=0,inspecting=false;const raycaster=new THREE.Raycaster(),clock=new THREE.Clock();
const playerFill=document.getElementById('playerFill'),enemyFill=document.getElementById('enemyFill'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),startButton=document.getElementById('start'),weaponState=document.getElementById('weaponState');
function updateHud(){playerFill.style.width=Math.max(0,player.health)+'%';enemyFill.style.width=Math.max(0,ai.health)+'%';document.getElementById('playerText').textContent=Math.max(0,Math.ceil(player.health));document.getElementById('enemyText').textContent=Math.max(0,Math.ceil(ai.health));document.getElementById('ammoText').textContent=`${player.ammo} / ${player.reserve}`;weaponState.textContent=reloading?'RELOADING':inspecting?'INSPECTING':player.slideTime>0?'SLIDING':keys.shift?'SPRINTING':'RIFLE'}
