<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rogue Island — Jungle Survival</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <aside class="hud">
      <p class="eyebrow">A tropical survival game</p>
      <h1>Rogue Island</h1>
      <div class="stats">
        <div><span>Health</span><strong id="health">100</strong></div>
        <div><span>Ammo</span><strong id="ammo">30</strong></div>
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Time</span><strong id="time">90</strong></div>
      </div>
      <section class="mission"><h2>Mission</h2><p id="message">Survive for 90 seconds. Collect supplies and keep moving.</p></section>
      <section class="controls"><h2>Controls</h2><ul><li>Move: WASD or arrow keys</li><li>Aim: mouse or touch</li><li>Shoot: click or tap</li><li>Reload: R</li></ul></section>
      <button id="restart" type="button">Restart Mission</button>
    </aside>
    <section class="arena" aria-label="Game area">
      <canvas id="game" width="960" height="600" aria-label="Rogue Island game. Move with WASD, aim and shoot with your mouse."></canvas>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
