<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue Island</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <aside class="hud-panel">
        <div class="brand-block">
          <p class="eyebrow">Tropical survival shooter</p>
          <h1>Rogue Island</h1>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <span>Health</span>
            <strong id="healthValue">100</strong>
          </div>
          <div class="stat-box">
            <span>Ammo</span>
            <strong id="ammoValue">30</strong>
          </div>
          <div class="stat-box">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="stat-box">
            <span>Time</span>
            <strong id="timeValue">90</strong>
          </div>
        </div>

        <div class="mission-box">
          <h2>Mission</h2>
          <p id="statusMessage">Survive the jungle assault and keep moving.</p>
        </div>

        <div class="controls-box">
          <h2>Controls</h2>
          <ul>
            <li>Move: WASD</li>
            <li>Aim: mouse</li>
            <li>Shoot: click</li>
            <li>Reload: R</li>
          </ul>
        </div>

        <button id="restartButton" type="button">Restart Mission</button>
      </aside>

      <main class="arena-wrap">
        <canvas id="gameCanvas" width="960" height="600" aria-label="Rogue Island game canvas"></canvas>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
